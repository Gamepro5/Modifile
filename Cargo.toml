[workspace]
resolver = "2"
members = [
    "crates/modifile-core",
    "crates/modifile-cli",
    "crates/modifile-gui",
]

[workspace.package]
# A released build does not use this number: the release workflow stamps the
# tag over it before building, so the tag is the version and the two cannot
# disagree. That matters because Modifile decides whether it is out of date by
# comparing its built-in version against the newest published tag — a binary
# reporting less than its own tag believes it is behind itself and offers the
# same update for ever.
#
# So this line is what a build *from source* reports, and the last released
# version is the sane thing for it to say. Nothing breaks if it lags; it is not
# the source of truth for a release.
version = "1.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gamepro5/modifile"

[workspace.dependencies]
modifile-core = { path = "crates/modifile-core" }

# Release builds are tuned for a small, fast single binary. The whole point of
# this project is to not be a 300 MB Electron app.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

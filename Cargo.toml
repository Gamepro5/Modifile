[workspace]
resolver = "2"
members = [
    "crates/modifile-core",
    "crates/modifile-cli",
    "crates/modifile-gui",
]

[workspace.package]
# This must match the release tag it ships under. Modifile decides whether it
# is out of date by comparing this against the newest published tag, so a
# binary built from 0.1.0 and released as v1.1 believes it is a year behind
# itself and offers the same update for ever. The release workflow refuses to
# build a tag that disagrees with this line.
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gamepro5/modifile"

[workspace.dependencies]
modifile-core = { path = "crates/modifile-core" }

# Release builds are tuned for a small, fast single binary. The whole point of
# this project is to not be a 300 MB Electron app.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

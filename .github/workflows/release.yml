name: Release

# Builds both binaries natively on each platform and attaches the archives to a
# GitHub Release. Cross-compiling is deliberately not attempted: aws-lc-sys
# (via rustls) needs a C toolchain and the GUI needs X11/Wayland/GL headers, so
# a native runner per platform is the cheap, boring way to get a working build.
#
# Three ways in, because all three are things a person actually does:
#   - push a tag:            git tag v1.0 && git push origin v1.0
#   - publish a release through the GitHub web UI
#   - Actions -> Release -> Run workflow, against a tag that already exists
#
# Tag names are matched both with and without the leading v. A tag that matches
# neither pattern silently does nothing, which is a miserable way to spend an
# afternoon.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.0)'
        required: true

permissions:
  contents: write

# Tagging and then publishing a release from that tag fires twice. Let the
# second run wait rather than race the first one's asset uploads.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: glibc 2.35 there, so the binaries also
          # run on Ubuntu 22.04, Debian 12 and anything newer. Building on
          # 24.04 would hard-require glibc 2.39 for no benefit.
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows

    steps:
      # Checking out a tag that does not exist fails with a bare "git exited
      # with code 1" and no hint as to which of the twenty things went wrong.
      - name: Check that the tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::No tag '${{ inputs.tag }}' in ${{ github.repository }}. Create it first: git tag ${{ inputs.tag }} && git push origin ${{ inputs.tag }} — which also starts this workflow on its own."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # Modifile updates itself by comparing its built-in version against the
      # newest published tag. If the two disagree, every install believes it is
      # out of date for ever and re-downloads the same release on every launch.
      # That is invisible until it is shipped, so it is caught here instead.
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          # v1.1 and 1.1 are the same tag; 1.1 and 1.1.0 are the same version.
          norm() { echo "${1#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          if [ "$(norm "$tag")" != "$(norm "$crate")" ]; then
            echo "::error::Tag '$tag' does not match the version in Cargo.toml ('$crate'). Self-update compares these, so they must agree. Set workspace.package.version to ${tag#v} and commit before tagging."
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -V && cargo -V

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="modifile-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/modifile.exe target/release/modifile-gui.exe "dist/${name}/"
          else
            cp target/release/modifile target/release/modifile-gui "dist/${name}/"
          fi
          cp README.md "dist/${name}/"
          [ -f LICENSE ] && cp LICENSE "dist/${name}/" || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum modifile-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Always a draft: a release is public the moment it exists, and a bad
      # binary cannot be unpublished from the people who already have it.
      # Check the archives, edit the notes, then press Publish.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Modifile $TAG" \
              --generate-notes \
              --draft
          fi

name: Release

# Builds both binaries natively on each platform and attaches the archives to a
# GitHub Release. Cross-compiling is deliberately not attempted: aws-lc-sys
# (via rustls) needs a C toolchain and the GUI needs X11/Wayland/GL headers, so
# a native runner per platform is the cheap, boring way to get a working build.
#
# Three ways in, because all three are things a person actually does:
#   - Actions -> Release -> Run workflow, and leave the box empty. The last
#     released version gets its patch number bumped, the tag is made for you,
#     and the commit you ran it from is what ships. Nothing to type, nothing
#     to bump, nothing to commit first — which is the point, because tagging
#     from a desktop Git client is awkward and choosing a number is a decision
#     nobody wants to make twice a day.
#   - push a tag:            git tag v1.0 && git push origin v1.0
#   - publish a release through the GitHub web UI
#
# Tag names are matched both with and without the leading v. A tag that matches
# neither pattern silently does nothing, which is a miserable way to spend an
# afternoon.
#
# Whichever way in, the tag is the version: it is stamped over
# workspace.package.version in the runner's checkout, so the two cannot
# disagree and no commit is needed to keep them in step.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release. Leave blank to bump the last one.'
        required: false

permissions:
  contents: write

# Tagging and then publishing a release from that tag fires twice. Let the
# second run wait rather than race the first one's asset uploads.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide what this release is called, and make sure a tag by that name
  # exists on the commit being released.
  #
  # This job is why "Run workflow" is enough on its own. Tagging from a
  # desktop Git client is awkward, and picking a number is a decision nobody
  # wants to make twice a day — so leaving the box blank takes the last
  # released version and adds one to its patch number. The only thing that has
  # to be true of a version is that it is higher than the last one, because
  # that is all self-update compares.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A tag push or a published release already names itself.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "releasing ${{ github.ref_name }} (named by the trigger)"
            exit 0
          fi

          asked="${{ inputs.tag }}"
          if [ -n "$asked" ]; then
            tag="$asked"
          else
            # Newest published release, or 0.0.0 if this is the first.
            last=$(gh release list --limit 1 --json tagName \
                     --jq '.[0].tagName // "0.0.0"' 2>/dev/null || echo "0.0.0")
            tag=$(echo "${last#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            echo "last release was '${last}', so this one is '${tag}'"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Point the tag at the commit this run was started from. `--force`
          # so a release that failed to build can be retried on a newer commit
          # under the same name, which is the common case after a fix.
          git tag --force "$tag" "${{ github.sha }}"
          git push --force origin "refs/tags/$tag"
          echo "tagged ${{ github.sha }} as $tag"

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: glibc 2.35 there, so the binaries also
          # run on Ubuntu 22.04, Debian 12 and anything newer. Building on
          # 24.04 would hard-require glibc 2.39 for no benefit.
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows

    steps:
      # Checking out a tag that does not exist fails with a bare "git exited
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # Modifile updates itself by comparing its built-in version against the
      # newest published tag. If the two disagree, every install believes it is
      # out of date for ever and re-downloads the same release on every launch.
      # That is invisible until it is shipped, so it is caught here instead.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -V && cargo -V

      # The tag *is* the version.
      #
      # This used to be a check: tag and Cargo.toml had to agree, and a release
      # failed until someone bumped the file and committed. The requirement was
      # real but the chore was not — deriving one from the other makes them
      # unable to disagree, so releasing is typing a tag and nothing else.
      #
      # Nothing is committed back. The stamp lives only in the runner's
      # checkout, which is what makes a tag enough on its own.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          # v1.2 and 1.2 are the same tag; 1.2 and 1.2.0 are the same version.
          version=$(echo "${tag#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')

          # Only the first `version = "…"`, which is [workspace.package]'s. A
          # plain global replace would rewrite every dependency pin below it.
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' Cargo.toml

          # Cargo.lock records the workspace crates' versions too, and the
          # build runs --locked. `--offline` because this touches nothing but
          # those three entries and must not reach for the network.
          cargo update --workspace --offline

          echo "building $tag as $(grep -m1 '^version = ' Cargo.toml)"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.tag }}"
          name="modifile-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/modifile.exe target/release/modifile-gui.exe "dist/${name}/"
          else
            cp target/release/modifile target/release/modifile-gui "dist/${name}/"
          fi
          cp README.md "dist/${name}/"
          [ -f LICENSE ] && cp LICENSE "dist/${name}/" || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum modifile-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Always a draft: a release is public the moment it exists, and a bad
      # binary cannot be unpublished from the people who already have it.
      # Check the archives, edit the notes, then press Publish.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Modifile $TAG" \
              --generate-notes \
              --draft
          fi

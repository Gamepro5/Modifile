schema = 1

[game]
id = "valheim"
name = "Valheim"
description = """
BepInEx plugins. The dedicated server takes the same plugins as the client, so
both are targets here and a single profile can cover them at once.
Plugins ship as compiled .dll, so most Valheim mods read as `unverified binary`
unless the author publishes build attestations."""
maintainers = ["bundled"]

# Valheim mods are BepInEx plugins, and without BepInEx the game never reads
# BepInEx/plugins at all — mods install perfectly and do nothing. Installing it
# is extracting one archive over the game root, so Modifile can do it.
[[loaders]]
id = "bepinex"
name = "BepInEx"
kind = "archive"
source = "github:BepInEx/BepInEx"
page = "https://github.com/BepInEx/BepInEx/releases"
# One build per operating system, and the dedicated server uses the same one.
windows_assets = ["bepinex_win_x64_*.zip", "bepinex_x64_*.zip"]
linux_assets = ["bepinex_linux_x64_*.zip", "bepinex_unix_x64_*.zip"]
macos_assets = ["bepinex_macos_x64_*.zip", "bepinex_unix_x64_*.zip"]
# Any one of these means it is already laid over the game.
markers = ["BepInEx/core/BepInEx.dll", "winhttp.dll", "run_bepinex.sh", "doorstop_config.ini"]

# Valheim can be pointed at a mod folder that is not its own, so Play gives
# each profile a real instance and never modifies the game directory. See the
# comments in repo.toml for how doorstop makes that work.
[instance]
kind = "doorstop"
target = "BepInEx/core/BepInEx.Preloader.dll"
game_files = [
  "winhttp.dll", "doorstop_config.ini", ".doorstop_version",
  "run_bepinex.sh", "libdoorstop.so", "libdoorstop_x64.so",
]

# Valheim mods mostly live on Thunderstore. Some also publish GitHub releases,
# which is worth searching too because a GitHub release can be tied back to
# readable source.
[search]
github_topics = ["valheim-mod", "valheim"]
# Thunderstore is where Valheim mods and modpacks actually live, and it needs
# no key. The slug is the one in the site's own URL:
# thunderstore.io/c/valheim/.
thunderstore_community = "valheim"

# BepInEx rewrites every plugin's .cfg on startup and the user edits them, so
# they belong to the profile rather than to the mod. ValheimPlus is the obvious
# case: two profiles want two different valheim_plus.cfg files.
[state]
paths = ["config"]

[paths]
plugins = "BepInEx/plugins"
patchers = "BepInEx/patchers"
config = "BepInEx/config"
core = "BepInEx/core"
root = "."

[assets]
prefer = ["*.zip"]
accept = ["*.dll"]
reject = ["*sources*", "*symbols*", "*.pdb", "*.asc", "*.sig", "*debug*"]
unpack = ["*.zip"]

# Rules are tried in order; the first match wins. The nested-path rules come
# first so a mod that ships a full BepInEx tree lands correctly, and the bare
# .dll rule catches the flat zips that most authors actually publish.

# BepInEx itself, which a Thunderstore modpack lists as an ordinary dependency.
# Its core assemblies are not plugins: swept into plugins/ by the bare .dll
# rule below they give you a game that loads nothing at all, which is the most
# confusing way a pack can fail — everything installs, nothing happens.
[[install]]
match = "**/bepinex/core/**"
into = "core"
strip = "core/"

# The doorstop shim that actually starts BepInEx, which belongs beside the game
# executable rather than inside the BepInEx tree.
[[install]]
match = "**/{winhttp.dll,doorstop_config.ini,.doorstop_version,run_bepinex.sh,libdoorstop.so,libdoorstop_x64.so}"
into = "root"
flatten = true

[[install]]
match = "**/bepinex/patchers/**"
into = "patchers"
strip = "patchers/"

[[install]]
match = "**/bepinex/plugins/**"
into = "plugins"
strip = "plugins/"

# Anything under a config directory, whatever it is called. BepInEx's own
# convention is .cfg, but mods ship .json, .yml, .ini and whole subfolders, so
# this matches the directory rather than an extension.
[[install]]
match = "**/bepinex/config/**"
into = "config"
strip = "config/"
mutable = true

[[install]]
match = "**/*.dll"
into = "plugins"
flatten = true

# Thunderstore packaging. Every package carries these and none of them belong
# in a game directory.
[[install]]
match = "**/{manifest.json,icon.png,README.md,CHANGELOG.md,LICENSE,LICENSE.md,LICENSE.txt}"
into = "root"
skip = true

# Loose config files sitting at the archive root. Deliberately a short list of
# extensions rather than "anything not a .dll".
[[install]]
match = "*.{cfg,ini,yml,yaml,toml}"
into = "config"
flatten = true
mutable = true

# Assets a plugin loads at runtime, kept beside it.
[[install]]
match = "**/*.assetbundle"
into = "plugins"
flatten = true

[[targets]]
id = "client"
name = "Valheim"
kind = "client"
markers = ["valheim.exe", "valheim.x86_64"]
processes = ["valheim.exe", "valheim.x86_64"]
candidates = [
  "${ProgramFiles(x86)}/Steam/steamapps/common/Valheim",
  "${HOME}/.steam/steam/steamapps/common/Valheim",
]

[targets.steam]
app_id = 892970
dir = "Valheim"

[[targets]]
id = "server"
name = "Valheim Dedicated Server"
kind = "server"
markers = ["valheim_server.exe", "valheim_server.x86_64"]
processes = ["valheim_server.exe", "valheim_server.x86_64"]
candidates = [
  "${ProgramFiles(x86)}/Steam/steamapps/common/Valheim dedicated server",
  "${HOME}/.steam/steam/steamapps/common/Valheim dedicated server",
]

[targets.steam]
app_id = 896660
dir = "Valheim dedicated server"

schema = 1

[game]
id = "wow"
name = "World of Warcraft (Retail)"
description = """
Addons are folders of Lua under Interface/AddOns. Because the shipped artifact
is the source, every addon installed here reaches the `readable source` rung —
you can open any file and read exactly what will run.
Retail, Classic Era and progression Classic are separate games in Modifile, not
flavors of one, because their addons are not interchangeable: they target
different APIs and an addon built for one will not run on another."""
maintainers = ["bundled"]

# Addons are plain Lua read at load time — nothing holds the files open, and
# /reload picks up changes. So unlike a BepInEx game, mods can be installed
# while WoW is running.
[running]
allow_changes = true
note = "WoW is running. Type /reload in game to pick up the change."

# WoW addons live on CurseForge, which needs a key and whose authors can block
# third-party downloads. The ones Modifile can actually install are the ones
# published to GitHub Releases — overwhelmingly via the BigWigs packager — so
# GitHub is the right index to search, and it only ever shows installable
# results. Modrinth carries no WoW addons at all.
[search]
github_topics = ["wow-addon", "wowaddon", "world-of-warcraft"]
github_terms = ["wow", "addon"]

# CurseForge addresses projects by number; this is how a slug from a URL
# gets resolved to one.
curseforge_game_id = 1

[paths]
addons = "Interface/AddOns"
# Saved variables. Present so a pack can reference it; nothing installs here.
wtf = "WTF"

[assets]
# The BigWigs packager, the de-facto standard release pipeline for WoW addons,
# emits `<Name>-<version>-<flavor>.zip` and an unsuffixed zip for retail.
prefer = ["*-{flavor}.zip", "*-{flavor}-*.zip", "*_{flavor}.zip"]
accept = ["*.zip"]
reject = ["*nolib*", "*sources*", "*-src*", "*.pdb", "*.asc", "*.sig", "*debug*"]
unpack = ["*.zip"]

# Every top-level directory in the zip is one addon folder, copied wholesale.
# The `*/**` (rather than `**`) keeps stray root-level READMEs out of AddOns.
[[install]]
match = "*/**"
into = "addons"

[[targets]]
id = "client"
name = "Retail"
kind = "client"
flavor = "mainline"
markers = ["Wow.exe", "World of Warcraft.app", "WowT.exe"]
processes = ["Wow.exe", "WowT.exe"]
# Refuse every other flavor's build.
asset_reject = [
  "*-classic*", "*-bcc*", "*-tbc*", "*-wrath*", "*-wotlk*",
  "*-cata*", "*-mop*", "*-mists*", "*-vanilla*",
]
candidates = [
  "${ProgramFiles(x86)}/World of Warcraft/_retail_",
  "${ProgramFiles}/World of Warcraft/_retail_",
  "${HOME}/Games/world-of-warcraft/drive_c/Program Files (x86)/World of Warcraft/_retail_",
]

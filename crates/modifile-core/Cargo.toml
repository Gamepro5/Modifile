[package]
name = "modifile-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
toml = "1.1.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# The Linux release archive is a .tar.gz, so self-update needs to open one.
# flate2 is already in the tree behind zip's deflate support, so this costs a
# small tar reader and nothing else.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
toml = "1.1.6"

[package]
name = "modifile-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "modifile-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
modifile-core = { version = "0.1.0", path = "../modifile-core" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

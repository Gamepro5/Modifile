[package]
name = "modifile-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "modifile"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
modifile-core = { version = "0.1.0", path = "../modifile-core" }
